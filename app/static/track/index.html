<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoPT — estado do seu pedido</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Página privada para acompanhar o estado do seu pedido CargoPT.">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/cargopt-icon.svg">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=tokens-v1">
  <link rel="stylesheet" href="/assets/css/components.css?v=components-v2">
  <link rel="stylesheet" href="/assets/css/landing.css?v=design-unified-v1">
  <link rel="stylesheet" href="/assets/css/track.css?v=workspace-design-v4">
  <link rel="stylesheet" href="/assets/css/progress-header.css?v=progress-v1">
</head>
<body data-locale="pt" class="tracking-page">
  <header class="site-header">
    <a class="logo" href="/" aria-label="CargoPT"><span class="logo-cargo">Cargo</span><span class="logo-pt">PT</span></a>
    <nav class="header-actions" aria-label="Navigation">
      <button id="copyTrackingLink" class="button button-small button-header-action" type="button">Copiar track link</button>
    </nav>
  </header>

  <main id="top">
    <section
      id="trackingProgressHeader"
      class="progress-header-shell"
      aria-label="Progresso do pedido"
    ></section>

    <section class="section track-workspace-shell">
      <aside
        id="otherRequestsPanel"
        class="track-workspace-sidebar"
        aria-label="Outros pedidos"
        hidden
      >
        <h2 class="track-sidebar-title">Outros pedidos</h2>
        <div id="trackPedidosList" class="track-offer-nav-list"></div>
      </aside>

      <section id="trackingPanel" class="tracking-panel tracking-request-card" aria-label="Propostas do pedido">
        <div id="trackingPanelBody"></div>

        <section id="errorCard" class="track-card error-card" hidden>
          <p class="eyebrow">Erro</p>
          <h2>Não foi possível carregar este pedido</h2>
          <p>Verifique se abriu o link completo. Se o problema continuar, contacte a CargoPT.</p>
        </section>
      </section>
    </section>
  </main>

  <footer class="site-footer"><strong class="footer-logo"><span class="logo-cargo">Cargo</span><span class="logo-pt">PT</span></strong><span>Serviço de pedidos para mudanças e transporte em Portugal.</span><a href="mailto:hello@cargopt.pt">hello@cargopt.pt</a></footer>
  <script src="/assets/js/progress-header.js?v=progress-v1" defer></script>
  <script src="/assets/js/tracking-workspace.js?v=shared-v3" defer></script>
  <script src="/assets/js/track.js?v=status-favicon-v9" defer></script>
</body>
</html>
