<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoPT — estado do seu pedido</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Página privada para acompanhar o estado do seu pedido CargoPT.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/cargopt-icon.svg">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#111827">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet" href="/assets/css/landing.css?v=workspace-v4">
  <link rel="stylesheet" href="/assets/css/track.css?v=request-card-surface-v2">
</head>
<body data-locale="pt" class="tracking-page">
  <header class="site-header">
    <a class="logo" href="/" aria-label="CargoPT">CargoPT</a>
    <nav class="header-actions track-header-actions" aria-label="Navigation">
      <button id="copyTrackingLink" class="track-header-action button is-small is-light" type="button">Copiar link</button>
      <a id="shareTrackingWhatsApp" class="track-header-action button is-small is-light" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    </nav>
  </header>

  <main id="top">
    <section class="section track-workspace-shell">
      <aside class="open-pedidos hero-workspace track-workspace-sidebar" aria-label="Ofertas recebidas">
        <p class="open-pedidos-eyebrow">Ofertas</p>
        <h2 class="open-pedidos-title">Ofertas recebidas</h2>
        <p class="open-pedidos-intro">Escolha uma oferta para este pedido.</p>
        <div id="trackOffersList" class="track-offer-nav-list"></div>
      </aside>

      <section id="trackingPanel" class="tracking-panel hero-panel tracking-request-card" aria-label="Cartão de estado do pedido">
        <div id="trackingPanelBody"></div>

        <section id="errorCard" class="track-card error-card" hidden>
          <p class="eyebrow">Erro</p>
          <h2>Não foi possível carregar este pedido</h2>
          <p>Verifique se abriu o link completo. Se o problema continuar, contacte a CargoPT.</p>
        </section>
      </section>
    </section>
  </main>

  <script src="/assets/js/tracking-workspace.js?v=shared-v1" defer></script>
  <script src="/assets/js/track.js?v=thin-v1" defer></script>
</body>
</html>
