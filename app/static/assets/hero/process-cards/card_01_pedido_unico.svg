<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" role="img" aria-labelledby="title desc">
  <title id="title">Pedido único e gratuito</title>
  <desc id="desc">Checklist preenchido com uma caixa de transporte.</desc>
  <defs>
